# .github/workflows/deploy.yml
#
# Ships master to Railway — but only after CI has gone green.
#
# This waits on the CI workflow rather than duplicating its steps, and rather
# than using Railway's own "deploy on push" integration, which would ship a red
# build: Railway watches the branch, not the test result.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  # A manual button, for rolling forward after fixing something by hand.
  workflow_dispatch:

concurrency:
  # One deploy at a time, and never cancel one midway: a half-applied release is
  # worse than a queued one.
  group: deploy-production
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The gate. workflow_run fires whatever the outcome, so this is what stops a
    # failing suite from reaching production.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install the Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        # --ci streams the build log and exits non-zero if the build fails, so a
        # broken release fails this job instead of being reported as shipped.
        run: railway up --service "${{ vars.RAILWAY_SERVICE || 'new-aeon-cms' }}" --ci

      # Migrations are NOT run from here.
      #
      # Railway's Postgres has no public endpoint — postgres.railway.internal
      # resolves only inside the project's private network — so a migrate step
      # in this job cannot reach it, and exposing the database through a public
      # proxy purely to let CI migrate it would widen the attack surface of the
      # one service holding every customer record.
      #
      # Instead railway.json declares `preDeployCommand: node migrate.cjs`,
      # which Railway runs once per release, on the private network, before the
      # new version takes traffic. A failed migration aborts the release rather
      # than promoting a container whose schema does not match its code.
