# docker/compose.yaml
#
# A runnable reference deployment. Build from the repository root so the build
# context and .dockerignore apply:
#
#   docker compose -f docker/compose.yaml up --build
#
# Every secret below comes from the environment, never from a literal. Put them
# in a .env beside this file — which .dockerignore and .gitignore both exclude.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-new_aeon_cms}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # The app's `depends_on` waits for this, so it must test the database
      # itself rather than the port: postgres accepts connections briefly
      # during init and then restarts, and a port check passes on that window.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-new_aeon_cms}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # next.config.ts is evaluated at BUILD time and bakes the media host
        # into next/image's remotePatterns. Passing this only at runtime leaves
        # the bucket host out of the allow-list and every remote image 400s.
        S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${APP_PORT:-3000}:3000'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-new_aeon_cms}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET (min 32 chars)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET (min 32 chars, different)}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      ADMIN_PATH: ${ADMIN_PATH:-/admin}

      # Storage. Leave as `local` only for a throwaway run: the container
      # filesystem is ephemeral, so uploads do not survive a redeploy.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}

      MAIL_DRIVER: ${MAIL_DRIVER:-log}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
      MAIL_ADMIN_TO: ${MAIL_ADMIN_TO:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}

volumes:
  db-data:
