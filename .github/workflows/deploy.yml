# .github/workflows/deploy.yml
#
# Ships master to every Railway service in RAILWAY_SERVICES — but only after CI
# has gone green. One codebase, one release, N sites: each has its own service,
# its own database and its own environment variables, and shares everything else.
#
# This waits on the CI workflow rather than duplicating its steps, and rather
# than using Railway's own "deploy on push" integration, which would ship a red
# build: Railway watches the branch, not the test result.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  # A manual button, for rolling forward after fixing something by hand.
  workflow_dispatch:

concurrency:
  # One release at a time, and never cancel one midway: a half-applied release
  # is worse than a queued one. The matrix legs inside a release run together —
  # they target different services, so they cannot collide — and the group keeps
  # a second release from starting on top of them.
  group: deploy-production
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The gate. workflow_run fires whatever the outcome, so this is what stops a
    # failing suite from reaching production.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    strategy:
      # One leg per Railway service, so every site ships from the same green CI
      # run rather than each drifting to whenever someone remembered it.
      #
      # The list is a repository variable, not a literal here, because a service
      # has to EXIST in Railway before it can be deployed to: `railway up
      # --service <unknown>` exits non-zero, which would turn this job red on
      # master and make a working pipeline look broken. Naming a site in a file
      # cannot conjure it in Railway, so the file ships the sites that are
      # ready and the variable adds the next one the day it is.
      #
      # To add al-ai.ai, once its service exists in the Railway project:
      #
      #   Settings → Secrets and variables → Actions → Variables
      #   RAILWAY_SERVICES = ["new-aeon-cms","al-ai"]
      #
      # Singular RAILWAY_SERVICE still works and still means one site; it is
      # the fallback below so an existing setup keeps deploying untouched.

      # The sites are independent. One failing to build is a reason to look at
      # that site, never a reason to cancel a release the others were mid-way
      # through — the default would leave them on mismatched versions.
      fail-fast: false
      matrix:
        # Kept on one line on purpose: in a folded (>-) scalar a more-indented
        # continuation is preserved literally rather than folded to a space, so
        # wrapping this would embed a newline inside the ${{ }} expression.
        service: ${{ fromJSON(vars.RAILWAY_SERVICES || format('["{0}"]', vars.RAILWAY_SERVICE || 'new-aeon-cms')) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install the Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy ${{ matrix.service }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        # --ci streams the build log and exits non-zero if the build fails, so a
        # broken release fails this job instead of being reported as shipped.
        #
        # One token covers every service in the same Railway project. Sites in a
        # SEPARATE project need their own, and this step is where that would be
        # selected — the matrix leg knows which site it is.
        run: railway up --service "${{ matrix.service }}" --ci

      # Migrations are NOT run from here.
      #
      # Railway's Postgres has no public endpoint — postgres.railway.internal
      # resolves only inside the project's private network — so a migrate step
      # in this job cannot reach it, and exposing the database through a public
      # proxy purely to let CI migrate it would widen the attack surface of the
      # one service holding every customer record.
      #
      # They run from the image's own entrypoint instead:
      #
      #   CMD ["sh", "-c", "node migrate.cjs && node server.js"]   docker/Dockerfile
      #
      # so the server only starts if the migration succeeded, and a container
      # whose schema does not match its code never reaches the healthcheck.
      #
      # That also scales to N sites without a line here: each service boots its
      # own container against its own DATABASE_URL, so each migrates its own
      # database and a failure is contained to the site that hit it.
      #
      # This used to say `preDeployCommand: node migrate.cjs` in railway.json.
      # It is not there any more, and it would not help if it were: Railway
      # skipped it silently, and a release once started with no schema at all
      # while /api/health cheerfully returned 200. The same applies to
      # `dockerfilePath` in that file, which is why the Dockerfile is selected
      # by the RAILWAY_DOCKERFILE_PATH service variable. Treat railway.json as
      # documentation of intent, not as configuration that runs.
