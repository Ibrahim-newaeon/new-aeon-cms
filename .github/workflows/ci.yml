# .github/workflows/ci.yml
#
# Runs on every push and pull request. Nothing deploys until this is green —
# see deploy.yml, which waits on this workflow rather than racing it.
#
# The suite needs a real Postgres because most of what is worth testing is a
# query: the bilingual product rule, facet counts, draft visibility. Mocking the
# database here would test the mock.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push makes an in-flight run pointless; cancel it rather than paying
  # for a result nobody will read. Never cancels on master, where the run is the
  # gate for a deploy.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aeon
          POSTGRES_PASSWORD: aeon
          POSTGRES_DB: aeon_test
        ports: ['5432:5432']
        # Without the health check the first migration races the server's own
        # startup and fails with "the database system is starting up".
        options: >-
          --health-cmd "pg_isready -U aeon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://aeon:aeon@localhost:5432/aeon_test
      REDIS_URL: redis://localhost:6379
      # Test-only values. Long enough to satisfy lib/env.ts, and meaningless
      # outside this job — the real secrets live in Railway.
      JWT_ACCESS_SECRET: ci-access-secret-not-used-anywhere-real-0000
      JWT_REFRESH_SECRET: ci-refresh-secret-not-used-anywhere-real-000
      ADMIN_PATH: /admin
      NEXT_PUBLIC_ADMIN_PATH: /admin
      DEFAULT_LOCALE: ar
      AVAILABLE_LOCALES: ar,en
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      MAIL_DRIVER: log
      STORAGE_DRIVER: local
      # next start refuses to serve a standalone build, and the browser suite's
      # webServer is exactly that.
      NEXT_STANDALONE: '0'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Migrations build a database from empty
        # Runs BEFORE the real migrate, against a throwaway database. The chain
        # had never been run end to end — the schema was built with db:push and
        # hand-written ALTERs — so a generated catch-up migration collided with
        # a hand-written one. That only fails on a FRESH database: in
        # production, on the first deploy.
        run: npx tsx scripts/migrate-check.ts

      - name: Setup can only ever run once
        # /api/setup creates an administrator WITHOUT authentication, so this is
        # the property standing between a fresh deploy and a stranger owning the
        # CMS. Runs the real install() against a scratch database: once, then
        # again, then ten concurrently.
        run: npx tsx scripts/setup-check.ts

      - name: Migrate
        # migrate, NOT push. Production runs migrations, so CI has to run the
        # same thing or it tests a schema that is never deployed — which is how
        # three columns added by a hand-written ALTER stayed out of the
        # migrations entirely and would have 500'd a fresh install.
        run: npx drizzle-kit migrate

      - name: Seed
        # e2e/global-setup.ts refuses to start without an active shipping zone
        # and the admin user. It fails loudly rather than letting specs discover
        # the gap one confusing assertion at a time.
        # tsx directly, not `npm run db:seed`: that script passes
        # --env-file=.env for local convenience, and Node exits 9 when the file
        # is absent. CI has no .env by design — the values are job env above.
        #
        # --conditions=react-server: seed pulls in lib/setup/*, which import
        # `server-only` so a stray client import fails loudly at build time.
        # That package throws on sight in a plain Node process, which is what
        # this step is — it only resolves to its empty stub under React's
        # server condition. Without the flag this step has failed since the
        # wizard landed, and a red CI is a release that never ships.
        run: npx tsx --conditions=react-server scripts/seed.ts

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Unit tests
        run: npm run test:unit

      - name: The image builds with no database
        # Twice now a deploy has died in `next build` because a route was being
        # prerendered and queried the database — invisible on any machine whose
        # database happens to be up, which is every developer's. The Docker
        # build has only a placeholder DATABASE_URL, so this reproduces the one
        # condition that matters, by pointing it at a closed port.
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:59999/build
          JWT_ACCESS_SECRET: build-time-placeholder-not-a-real-secret-1
          JWT_REFRESH_SECRET: build-time-placeholder-not-a-real-secret-2
        run: npm run build

      - name: Build
        # Again with a real database, which is what the e2e run then serves.
        run: npm run build

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test

      - name: Upload the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
